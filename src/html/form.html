<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário de Captura | Metrifique-se CRM</title>
  <link rel="shortcut icon" type="image/png" href="../assets/images/logos/favicon.svg" />
  <link rel="stylesheet" href="../assets/css/styles.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-client.js"></script>

  <style>
    body {
      background-color: #F8FAFC;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .form-card {
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      width: 100%;
      padding: 32px;
      border: 1px solid #E2E8F0;
      transition: all 0.3s ease;
    }
    .form-card.dark-mode {
      background: #1E293B;
      color: #F8FAFC;
      border-color: #334155;
    }
    .form-card.dark-mode input, .form-card.dark-mode textarea {
      background-color: #0F172A;
      color: #F8FAFC;
      border-color: #334155;
    }
    .form-card.dark-mode input::placeholder, .form-card.dark-mode textarea::placeholder {
      color: #94A3B8;
    }
    .pulse-animation {
      animation: pulseScale 1.8s infinite ease-in-out;
    }
    @keyframes pulseScale {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body>

  <div class="form-card" id="form-card-container">
    <div class="text-center mb-4" id="form-logo-box">
      <img src="../assets/images/logos/logoblack.png" height="32" alt="Logo" id="tenant-logo-img">
    </div>

    <!-- FORMULÁRIO DE CAPTURA -->
    <div id="form-content-wrapper">
      <h4 class="fw-bold mb-1 text-center" id="form-title">Solicitar Demonstração</h4>
      <p class="text-muted fs-2 mb-4 text-center" id="form-desc">Preencha seus dados para receber o contato de nossa equipe.</p>

      <form id="public-capture-form">
        <div id="form-fields-container">
          <!-- Campos iniciais pré-renderizados estaticamente -->
          <div class="mb-3" id="field-box-name">
            <label class="form-label fs-2 fw-semibold">Nome Completo *</label>
            <input type="text" id="lead-name-input" class="form-control py-2.5" placeholder="Seu nome completo" required>
          </div>

          <div class="mb-3" id="field-box-email">
            <label class="form-label fs-2 fw-semibold">E-mail Comercial *</label>
            <input type="email" id="lead-email-input" class="form-control py-2.5" placeholder="seu@email.com" required>
          </div>

          <div class="mb-3" id="field-box-phone">
            <label class="form-label fs-2 fw-semibold">WhatsApp / Telefone *</label>
            <input type="tel" id="lead-phone-input" class="form-control py-2.5" placeholder="(00) 90000-0000" required>
          </div>

          <div class="mb-3" id="field-box-company">
            <label class="form-label fs-2 fw-semibold">Nome da Empresa</label>
            <input type="text" id="lead-company-input" class="form-control py-2.5" placeholder="Sua empresa">
          </div>

          <div class="mb-3 d-none" id="field-box-notes">
            <label class="form-label fs-2 fw-semibold">Mensagem / Observação</label>
            <textarea id="lead-notes-input" class="form-control" rows="3" placeholder="Como podemos te ajudar?"></textarea>
          </div>
        </div>

        <button type="submit" class="btn fw-bold w-100 py-3 mt-3 shadow-sm" id="form-submit-btn" style="background-color: #FF7A59; color: #FFF; font-size: 1rem; border-radius: 10px; border: none;">
          Enviar Solicitação
        </button>
      </form>
    </div>

    <!-- PÁGINA DE OBRIGADO PADRÃO DE ALTA QUALIDADE -->
    <div id="form-success-box" class="d-none text-center py-2">
      <div class="mb-3">
        <div class="p-3 bg-success bg-opacity-10 text-success rounded-circle d-inline-flex pulse-animation">
          <i class="ti ti-circle-check-filled fs-10"></i>
        </div>
      </div>
      
      <h4 class="fw-bold text-dark mb-2" id="success-title-text">Solicitação Enviada!</h4>
      <p class="text-muted fs-3 mb-4" id="success-msg-text">Obrigado por seu interesse. Nossa equipe já recebeu seus dados e entrará em contato em breve.</p>

      <div class="bg-light p-3 rounded-3 text-start mb-4 border">
        <small class="text-muted d-block uppercase fw-bold mb-2 fs-1"><i class="ti ti-info-circle me-1"></i> Resumo da Solicitação</small>
        <div class="d-flex align-items-center justify-content-between mb-1">
          <span class="text-muted fs-2">Lead:</span>
          <strong class="fs-2 text-dark" id="summary-lead-name">-</strong>
        </div>
        <div class="d-flex align-items-center justify-content-between">
          <span class="text-muted fs-2">E-mail:</span>
          <strong class="fs-2 text-dark" id="summary-lead-email">-</strong>
        </div>
      </div>

      <button type="button" class="btn btn-outline-secondary fw-bold w-100 py-2.5 mb-3" onclick="location.reload();">
        <i class="ti ti-reload me-1"></i> Enviar Nova Solicitação
      </button>

      <small class="text-muted fs-1 d-block"><i class="ti ti-shield-check me-1 text-success"></i> Form Captura Powered by Metrifique-se CRM</small>
    </div>
  </div>

  <script>
    function renderCustomFields(fields) {
      if (!fields) return;
      const nameBox = document.getElementById('field-box-name');
      const emailBox = document.getElementById('field-box-email');
      const phoneBox = document.getElementById('field-box-phone');
      const companyBox = document.getElementById('field-box-company');
      const notesBox = document.getElementById('field-box-notes');

      if (nameBox) nameBox.style.display = fields.name !== false ? 'block' : 'none';
      if (emailBox) emailBox.style.display = fields.email !== false ? 'block' : 'none';
      if (phoneBox) phoneBox.style.display = fields.phone !== false ? 'block' : 'none';
      if (companyBox) companyBox.style.display = fields.company !== false ? 'block' : 'none';
      if (notesBox) {
        if (fields.notes) notesBox.classList.remove('d-none');
        else notesBox.classList.add('d-none');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const tenantId = urlParams.get('tenant') || 'tenant-demo';
      const formId = urlParams.get('form');

      if (window.crmStore) {
        window.crmStore.setActiveTenantId(tenantId);
      }

      // 1. Synchronous Parse: Check URL Query Parameters First (Instant 0ms UI render!)
      const urlTitle = urlParams.get('title');
      const urlDesc = urlParams.get('desc');
      const urlBtn = urlParams.get('btn');
      const urlColor = urlParams.get('color');
      const urlTheme = urlParams.get('theme');
      const urlSource = urlParams.get('src');
      const urlSuccess = urlParams.get('success');
      const urlRedirect = urlParams.get('redirect');

      let form = window.crmStore ? window.crmStore.getFormById(formId) : null;
      let tenant = window.crmStore ? window.crmStore.getTenant() : null;

      if (!form && urlTitle) {
        form = {
          id: formId,
          tenant_id: tenantId,
          title: urlTitle,
          description: urlDesc || '',
          button_text: urlBtn || 'Enviar',
          button_color: urlColor || '#FF7A59',
          theme_mode: urlTheme || 'light',
          source: urlSource || 'Formulário do Site',
          success_message: urlSuccess || 'Solicitação Enviada com Sucesso!',
          redirect_url: urlRedirect || '',
          fields: {
            name: urlParams.get('fn') !== '0',
            email: urlParams.get('fe') !== '0',
            phone: urlParams.get('fp') !== '0',
            company: urlParams.get('fc') !== '0',
            notes: urlParams.get('fm') === '1'
          }
        };
      }

      // Fallback default form if still null
      if (!form) {
        form = {
          title: 'Solicitar Demonstração / Orçamento',
          description: 'Preencha seus dados para receber o contato de nossa equipe.',
          button_text: 'Enviar Solicitação',
          button_color: '#FF7A59',
          theme_mode: 'light',
          source: 'Formulário do Site',
          fields: { name: true, email: true, phone: true, company: true, notes: false }
        };
      }

      // Update UI Immediately (0ms)
      const formCard = document.getElementById('form-card-container');
      const formTitle = document.getElementById('form-title');
      const formDesc = document.getElementById('form-desc');
      const submitBtn = document.getElementById('form-submit-btn');

      if (formTitle && form.title) formTitle.innerText = form.title;
      if (formDesc && form.description) formDesc.innerText = form.description;
      if (submitBtn) {
        if (form.button_text) submitBtn.innerText = form.button_text;
        if (form.button_color) submitBtn.style.backgroundColor = form.button_color;
      }
      if (form.theme_mode === 'dark' && formCard) {
        formCard.classList.add('dark-mode');
      }

      const logoImg = document.getElementById('tenant-logo-img');
      if (logoImg) {
        if (tenant && tenant.logo_url) {
          logoImg.src = tenant.logo_url;
        } else if (form.theme_mode === 'dark') {
          logoImg.src = '../assets/images/logos/logowhite.png';
        }
      }

      renderCustomFields(form.fields);

      // 2. Asynchronous Background Check (Supabase Cloud)
      if (window.supabaseClient) {
        Promise.all([
          !tenant && tenantId ? window.supabaseClient.from('tenants').select('*').eq('id', tenantId).maybeSingle() : Promise.resolve({ data: null }),
          !form && formId ? window.supabaseClient.from('tenant_forms').select('*').eq('id', formId).maybeSingle() : Promise.resolve({ data: null })
        ]).then(([tRes, fRes]) => {
          if (tRes && tRes.data && logoImg) logoImg.src = tRes.data.logo_url;
          if (fRes && fRes.data) {
            const cloudForm = fRes.data;
            if (formTitle && cloudForm.title) formTitle.innerText = cloudForm.title;
            if (formDesc && cloudForm.description) formDesc.innerText = cloudForm.description;
            if (submitBtn && cloudForm.button_text) submitBtn.innerText = cloudForm.button_text;
            if (submitBtn && cloudForm.button_color) submitBtn.style.backgroundColor = cloudForm.button_color;
            if (cloudForm.fields) renderCustomFields(cloudForm.fields);
            form = cloudForm;
          }
        }).catch(err => console.warn('[Supabase Cloud Form Fetch Error]', err));
      }

      // 3. Handle Submit (Instant & Non-Blocking)
      const formEl = document.getElementById('public-capture-form');
      if (formEl) {
        formEl.addEventListener('submit', (e) => {
          e.preventDefault();

          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.innerText = 'Enviando...';
          }

          const nameInput = document.getElementById('lead-name-input');
          const emailInput = document.getElementById('lead-email-input');
          const phoneInput = document.getElementById('lead-phone-input');
          const companyInput = document.getElementById('lead-company-input');
          const notesInput = document.getElementById('lead-notes-input');

          const leadData = {
            tenant_id: tenantId,
            name: nameInput ? nameInput.value : 'Lead do Formulário',
            email: emailInput ? emailInput.value : '',
            phone: phoneInput ? phoneInput.value : '',
            company: companyInput ? companyInput.value : '',
            source: form ? (form.source || 'Formulário do Site') : 'Formulário do Site',
            notes: notesInput ? notesInput.value : ''
          };

          // Save locally
          if (window.crmStore) {
            try {
              if (typeof window.crmStore.addLead === 'function') {
                window.crmStore.addLead(leadData);
              } else if (typeof window.crmStore.saveLead === 'function') {
                window.crmStore.saveLead(leadData);
              }
              if (formId) window.crmStore.incrementFormSubmissions(formId);
            } catch(err) {
              console.warn('[Local Save Lead Exception]', err);
            }
          }

          // Non-blocking Save to Supabase Cloud in background
          if (window.supabaseClient) {
            const payload = {
              id: 'lead-' + Date.now(),
              tenant_id: tenantId,
              name: leadData.name,
              email: leadData.email,
              phone: leadData.phone,
              company: leadData.company,
              source: leadData.source,
              notes: leadData.notes,
              score: 25,
              created_at: new Date().toISOString()
            };
            window.supabaseClient.from('leads').upsert([payload]).then(({ error }) => {
              if (error) console.warn('[Supabase Save Lead Warning]', error);
              else console.log('[Supabase Save Lead Success]', payload.id);
            }).catch(err => console.warn('[Lead Submit Supabase Exception]', err));
          }

          // Handle Custom Redirect URL or Instant Default Thank You Screen (0ms)
          if (form && form.redirect_url && form.redirect_url.trim().startsWith('http')) {
            window.location.href = form.redirect_url.trim();
          } else {
            const formContent = document.getElementById('form-content-wrapper');
            const successBox = document.getElementById('form-success-box');
            const successMsg = document.getElementById('success-msg-text');
            const summaryName = document.getElementById('summary-lead-name');
            const summaryEmail = document.getElementById('summary-lead-email');

            if (summaryName) summaryName.innerText = leadData.name;
            if (summaryEmail) summaryEmail.innerText = leadData.email;

            if (form && form.success_message && successMsg) {
              successMsg.innerText = form.success_message;
            }

            if (formContent) formContent.classList.add('d-none');
            if (successBox) successBox.classList.remove('d-none');
          }
        });
      }
    });
  </script>

</body>

</html>
