<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário de Captura | Metrifique-se CRM</title>
  <link rel="shortcut icon" type="image/png" href="../assets/images/logos/favicon.svg" />
  <link rel="stylesheet" href="../assets/css/styles.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-client.js"></script>

  <style>
    body {
      background-color: #F8FAFC;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .form-card {
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      width: 100%;
      padding: 32px;
      border: 1px solid #E2E8F0;
    }
    .form-card.dark-mode {
      background: #1E293B;
      color: #F8FAFC;
      border-color: #334155;
    }
    .form-card.dark-mode input, .form-card.dark-mode textarea {
      background-color: #0F172A;
      color: #F8FAFC;
      border-color: #334155;
    }
    .form-card.dark-mode input::placeholder {
      color: #94A3B8;
    }
  </style>
</head>

<body>

  <div class="form-card" id="form-card-container">
    <div class="text-center mb-4" id="form-logo-box">
      <img src="../assets/images/logos/logoblack.png" height="32" alt="Logo" id="tenant-logo-img">
    </div>

    <h4 class="fw-bold mb-1 text-center" id="form-title">Solicitar Demonstração</h4>
    <p class="text-muted fs-2 mb-4 text-center" id="form-desc">Preencha seus dados para receber o contato de nossa equipe.</p>

    <form id="public-capture-form">
      <div id="form-fields-container">
        <!-- Renderizado via JS -->
      </div>

      <button type="submit" class="btn fw-bold w-100 py-3 mt-3 shadow-sm" id="form-submit-btn" style="background-color: #FF7A59; color: #FFF; font-size: 1rem; border-radius: 10px;">
        Enviar Solicitação
      </button>
    </form>

    <div id="form-success-box" class="d-none text-center py-4">
      <div class="p-3 bg-success bg-opacity-10 text-success rounded-circle d-inline-flex mb-3">
        <i class="ti ti-circle-check fs-8"></i>
      </div>
      <h5 class="fw-bold text-dark mb-2">Solicitação Enviada!</h5>
      <p class="text-muted fs-3 mb-0" id="success-msg-text">Obrigado! Entraremos em contato em breve.</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const tenantId = urlParams.get('tenant') || 'tenant-demo';
      const formId = urlParams.get('form');

      // Set active tenant if present
      if (window.crmStore) {
        window.crmStore.setActiveTenantId(tenantId);
      }

      const form = window.crmStore ? window.crmStore.getFormById(formId) : null;
      const tenant = window.crmStore ? window.crmStore.getTenant() : null;

      // Apply Tenant Logo & Title
      if (tenant && tenant.logo_url) {
        const logoImg = document.getElementById('tenant-logo-img');
        if (logoImg) logoImg.src = tenant.logo_url;
      }

      const formCard = document.getElementById('form-card-container');
      const formTitle = document.getElementById('form-title');
      const formDesc = document.getElementById('form-desc');
      const submitBtn = document.getElementById('form-submit-btn');

      if (form) {
        if (formTitle) formTitle.innerText = form.title;
        if (formDesc) formDesc.innerText = form.description;
        if (submitBtn) {
          submitBtn.innerText = form.button_text || 'Enviar';
          submitBtn.style.backgroundColor = form.button_color || '#FF7A59';
          submitBtn.style.borderColor = form.button_color || '#FF7A59';
        }
        if (form.theme_mode === 'dark' && formCard) {
          formCard.classList.add('dark-mode');
        }

        renderFields(form.fields);
      } else {
        renderFields({ name: true, email: true, phone: true, company: true, notes: false });
      }

      function renderFields(fields) {
        const container = document.getElementById('form-fields-container');
        if (!container) return;

        let html = '';
        if (fields.name !== false) {
          html += `
            <div class="mb-3">
              <label class="form-label fs-2 fw-semibold">Nome Completo *</label>
              <input type="text" id="lead-name-input" class="form-control" placeholder="Seu nome completo" required>
            </div>
          `;
        }
        if (fields.email !== false) {
          html += `
            <div class="mb-3">
              <label class="form-label fs-2 fw-semibold">E-mail Comercial *</label>
              <input type="email" id="lead-email-input" class="form-control" placeholder="seu@email.com" required>
            </div>
          `;
        }
        if (fields.phone !== false) {
          html += `
            <div class="mb-3">
              <label class="form-label fs-2 fw-semibold">WhatsApp / Telefone *</label>
              <input type="tel" id="lead-phone-input" class="form-control" placeholder="(00) 90000-0000" required>
            </div>
          `;
        }
        if (fields.company !== false) {
          html += `
            <div class="mb-3">
              <label class="form-label fs-2 fw-semibold">Nome da Empresa</label>
              <input type="text" id="lead-company-input" class="form-control" placeholder="Sua empresa">
            </div>
          `;
        }
        if (fields.notes) {
          html += `
            <div class="mb-3">
              <label class="form-label fs-2 fw-semibold">Mensagem / Observação</label>
              <textarea id="lead-notes-input" class="form-control" rows="3" placeholder="Como podemos te ajudar?"></textarea>
            </div>
          `;
        }

        container.innerHTML = html;
      }

      // Handle Submit
      const formEl = document.getElementById('public-capture-form');
      if (formEl) {
        formEl.addEventListener('submit', (e) => {
          e.preventDefault();

          const nameInput = document.getElementById('lead-name-input');
          const emailInput = document.getElementById('lead-email-input');
          const phoneInput = document.getElementById('lead-phone-input');
          const companyInput = document.getElementById('lead-company-input');
          const notesInput = document.getElementById('lead-notes-input');

          const leadData = {
            tenant_id: tenantId,
            name: nameInput ? nameInput.value : 'Lead do Formulário',
            email: emailInput ? emailInput.value : '',
            phone: phoneInput ? phoneInput.value : '',
            company: companyInput ? companyInput.value : '',
            source: form ? (form.source || 'Formulário do Site') : 'Formulário do Site',
            notes: notesInput ? notesInput.value : ''
          };

          // Save lead to CRM Store & Supabase
          if (window.crmStore) {
            window.crmStore.addLead(leadData);
            if (formId) window.crmStore.incrementFormSubmissions(formId);
          }

          // Show Success or Redirect
          if (form && form.redirect_url && form.redirect_url.startsWith('http')) {
            window.location.href = form.redirect_url;
          } else {
            formEl.classList.add('d-none');
            const successBox = document.getElementById('form-success-box');
            const successMsg = document.getElementById('success-msg-text');
            if (form && form.success_message && successMsg) {
              successMsg.innerText = form.success_message;
            }
            if (successBox) successBox.classList.remove('d-none');
          }
        });
      }
    });
  </script>

</body>

</html>
